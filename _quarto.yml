project: 
  type: website
website: 
  page-navigation: true
  favicon: images/favicon.ico
  back-to-top-navigation: true
  page-footer:
    border: true
    center:
      - text: "Website Owner"
        href: https://www.fisheries.noaa.gov/about/pacific-islands-fisheries-science-center
        target: _blank
      - text: "Contact"
        href: https://www.fisheries.noaa.gov/contact/pacific-islands-fisheries-science-center
        target: _blank
      - text: "NOAA"
        href: https://www.noaa.gov/
        target: _blank
      - text: "Privacy Policy"
        href: https://www.noaa.gov/privacy.html
        target: _blank
      - text: "Information Quality"
        href: https://www.noaa.gov/organization/information-technology/policy-oversight/information-quality
        target: _blank
      - text: "Disclaimer"
        href: https://www.fisheries.noaa.gov/national/about-us/website-policies-and-disclaimers
        target: _blank
    right:
      - text: "<img src='/images/logos/doc_logo_black.gif' style='height: 50px; width: auto;'/>"
        href: https://www.commerce.gov/
  navbar:
    title: "PSD: Data Team"
    background: $navbar-bg
    logo: "images/logos/noaa_logo.png"
    favicon: images/favicon.ico
    pinned: true
    align: center
    tools: 
      - icon: github
        href: https://github.com/PIFSC-Protected-Species-Division/PSD_Data_Team

    style: "docked"
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "Resources"
        href: resources.qmd
  sidebar:
    title: "PSD Data Links"
    logo: "images/logos/PSD_DataTeam_Icon.png" 
    background: "#88BFAB"
    id: main-docs
    style: "docked"
    collapse-level: 2
    contents:
      - text: "<b>Quick Links</b>"
      - section: "New Requests"
        contents:
          - text: "Apps"
            href:
          - text: "Database"
            href:  
          - text: "Data Science"
            href:           
      - section: "Issues"
        contents:
          - text: "Apps"
            href:
          - text: "Database"
            href:  
          - text: "Data Science"
            href:           
        
      
format:
  html:
    backgroundcolor: "#C9F1FF"
    theme:
      light: [cosmo, theme.scss] 
      dark: [cosmo, theme-dark.scss]
    css: style.css
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: false
    link-external-icon: true
    toc: true

filters:
  - include-files.lua
  - quarto

engine: knitr  
